<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - 空白の時間.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="diary.html">Diary</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
    <main class="container" style="padding-top: 1rem;">
        <div class="section-title">
            <h1>Contact</h1>
            <p class="subtitle">お問い合わせ</p>
        </div>

        <form id="contact-form" class="frame" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <div style="display: flex; gap: 1.5rem;">
                <div style="flex: 1;">
                    <label class="jp">お名前 / Name</label>
                    <input type="text" id="contact-name" name="name" style="width: 100%; padding: 1rem;" required>
                </div>
                <div style="flex: 1;">
                    <label class="jp">メールアドレス / Email</label>
                    <input type="email" id="contact-email" name="email" style="width: 100%; padding: 1rem;" required>
                </div>
            </div>
            <div>
                <label class="jp">メッセージ / Message</label>
                <textarea id="contact-message" name="message" rows="5" style="width: 100%; padding: 1rem;" required></textarea>
            </div>
            <button type="submit">送信 / Send</button>
        </form>

        <div id="contact-thanks" class="frame thanks-message" style="display: none;">
            <p class="jp">メッセージありがとうございます。</p>
            <p class="en">Thank you for your message.</p>
        </div>

    </main>
    <a href="diary.html" class="door-link">
        <div class="door-frame">
            <div class="door-panel">
                <div class="door-knob"></div>
            </div>
        </div>
    </a>
    <script src="script.js"></script>
</body>

</html>
