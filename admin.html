<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理人室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="diary.html">Diary</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main class="container" id="login-screen">
        <div class="section-title">
            <h1>管理人室</h1>
        </div>
        <div class="frame" style="display: flex; flex-direction: column; gap: 1rem; max-width: 300px; margin: 0 auto;">
            <input type="password" id="admin-password" placeholder="password" style="width: 100%; padding: 0.75rem;">
            <p id="admin-error" style="display: none; font-size: 0.8rem; opacity: 0.5; text-align: center;">パスワードが違います</p>
            <button id="admin-login">入室する</button>
        </div>
    </main>

    <main class="container" id="admin-room" style="display: none; width: 92vw; max-width: 92vw; padding-left: 2rem; padding-right: 2rem;">
        <div class="section-title">
            <h1>管理人室</h1>
            <p class="subtitle">投稿管理</p>
        </div>
        <div id="admin-container"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://membgduqkvqhfgruqbvb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lbWJnZHVxa3ZxaGZncnVxYnZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzY3MTYsImV4cCI6MjA5NTQ1MjcxNn0.CVJW9N5X4ecY3JS4ywBCy6XGJRUbOOISf7vyX1euQaw';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('admin-login').addEventListener('click', () => {
            const pw = document.getElementById('admin-password').value;
            if (pw === '4431') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-room').style.display = 'block';
                renderAdminEntries();
            } else {
                document.getElementById('admin-error').style.display = 'block';
            }
        });

        document.getElementById('admin-password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('admin-login').click();
        });

        async function renderAdminEntries() {
            const container = document.getElementById('admin-container');
            const { data: entries, error } = await db
                .from('entries')
                .select('*')
                .order('id', { ascending: false });

            if (error || !entries) return;
            container.innerHTML = '';

            entries.forEach(entry => {
                const item = document.createElement('div');
                item.className = 'frame';
                item.style.cssText = 'position: relative; padding: 1.5rem; margin-bottom: 1.5rem;';

                const date = document.createElement('span');
                date.className = 'date';
                date.textContent = entry.date;

                const text = document.createElement('p');
                text.style.fontSize = '0.9rem';
                text.style.whiteSpace = 'pre-wrap';
                text.textContent = entry.text;

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '×';
                deleteBtn.style.cssText = 'position: absolute; top: 0.75rem; right: 0.75rem; width: 1.6rem; height: 1.6rem; padding: 0; font-size: 0.85rem; font-weight: normal; line-height: 1;';
                deleteBtn.addEventListener('click', async () => {
                    await db.from('entries').delete().eq('id', entry.id);
                    item.remove();
                });

                item.appendChild(date);
                item.appendChild(text);
                item.appendChild(deleteBtn);
                container.appendChild(item);
            });
        }
    </script>
</body>
</html>
